name: Build Windows EXE and Release

# Builds a Windows installer (LinuxDesk-<version>.exe, via jpackage + WiX) every time main is
# pushed, and publishes it as a GitHub Release asset.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (includes jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          # jpackage --type exe shells out to WiX's candle/light. windows-latest ships WiX 3.x
          # under Program Files (x86) but doesn't put it on PATH.
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) {
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "WiX found at: $($wix.FullName)\bin"
          } else {
            Write-Error "WiX Toolset not found. jpackage --type exe requires WiX 3.x."
            exit 1
          }

      - name: Read project version
        id: ver
        shell: pwsh
        run: |
          $v = mvn -q "-Dexpression=project.version" "-DforceStdout" help:evaluate
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build application jar
        shell: pwsh
        run: mvn -B "-DskipTests" clean package

      - name: Stage runtime classpath for jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\dist | Out-Null
          mvn -B -q dependency:copy-dependencies "-DoutputDirectory=target\dist" "-DincludeScope=runtime"
          Copy-Item "target\linuxdesk-${{ steps.ver.outputs.version }}.jar" target\dist\

      - name: Build Windows EXE installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          jpackage `
            --type exe `
            --input target\dist `
            --dest dist `
            --name LinuxDesk `
            --main-jar "linuxdesk-${{ steps.ver.outputs.version }}.jar" `
            --main-class com.linuxdesk.Launcher `
            --icon packaging\icon.ico `
            --app-version "${{ steps.ver.outputs.version }}" `
            --vendor "LinuxDesk" `
            --description "LinuxDesk - SSH remote desktop client" `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: LinuxDesk v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          files: dist/*.exe
          generate_release_notes: true
